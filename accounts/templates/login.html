{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">

    <h2 class="mb-2 text-center fw-bold">ورود به حساب کاربری</h2>
    <p class="text-muted text-center mb-4">
        خوش آمدید 🌸 لطفاً وارد حساب خود شوید
    </p>

 <!-- وسط‌چین -->
    <div class="row justify-content-center">
        <div class="col-11 col-sm-8 col-md-5 col-lg-4">

            <!-- کارت -->
            <div class="card shadow p-4">

                <form method="POST" action="{% url 'accounts:login' %}" >
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label">نام کاربری</label>
                        <input type="text" name="username" class="form-control" required autofocus tabindex="1">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">رمز عبور</label>
                        <input type="password" id="id_password" name="password" class="form-control" required tabindex="2">
                    </div>

                    <input type="hidden" name="next" value="{{ next }}">

                    <button class="btn btn-primary w-100 mt-3" type="submit" tabindex="3">ورود</button>
                </form>
    
                <!-- 👇 اینجا لینک ثبت‌نام میاد -->
                <p class="text-center mt-3 mb-0">
                    حساب کاربری ندارید؟
                    <a href="{% url 'accounts:register' %}">ثبت‌نام کنید</a>
                </p>
                <p class="text-center mt-3">
                    <a href="{% url 'accounts:password_reset' %}">رمز عبور را فراموش کرده‌اید؟</a>
                </p>
            </div>
        </div>
    </div>
</div>
<script>
    
document.addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;

    const target = e.target;

    // فقط برای inputها
    if (target.tagName !== "INPUT") return;

    const form = target.form;
    if (!form) return;

    const inputs = Array.from(
        form.querySelectorAll("input:not([type=hidden]):not([disabled])")
    );

    const index = inputs.indexOf(target);

    // اگر آخرین input نبود، برو بعدی
    if (index > -1 && index < inputs.length - 1) {
        e.preventDefault();
        inputs[index + 1].focus();
    }
    // اگر آخرین input بود → submit طبیعی انجام میشه
});
</script>
<!-- ✅ اسکریپت نمایش/پنهان کردن رمز عبور - با محافظت کامل -->
<!-- ✅ اسکریپت نمایش/پنهان کردن رمز عبور - نسخه نهایی و تست‌شده برای راست‌چین -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    // 🔒 فقط در صفحه ورود اجرا شود
    if (!window.location.pathname.includes('/login')) {
        return;
    }

    const passwordInput = document.getElementById('id_password');
    if (!passwordInput) return;

    // ✅ ایجاد wrapper اختصاصی برای فیلد رمز عبور
    const wrapper = document.createElement('div');
    wrapper.style.position = 'relative';
    wrapper.style.width = '100%';
    
    // جایگذاری wrapper قبل از فیلد و انتقال فیلد به داخل wrapper
    const parent = passwordInput.parentNode;
    parent.insertBefore(wrapper, passwordInput);
    wrapper.appendChild(passwordInput);

    // ✅ ایجاد دکمه چشم با استایل دقیق برای راست‌چین
    const toggleBtn = document.createElement('button');
    toggleBtn.type = 'button';
    toggleBtn.className = 'btn btn-sm btn-outline-secondary password-toggle';
    toggleBtn.innerHTML = '<i class="fas fa-eye"></i>';
    toggleBtn.style.position = 'absolute';
    toggleBtn.style.left = '12px'; // فاصله دقیق از لبه چپ فیلد
    toggleBtn.style.top = '50%';
    toggleBtn.style.transform = 'translateY(-50%)';
    toggleBtn.style.zIndex = '10';
    toggleBtn.style.padding = '3px 8px';
    toggleBtn.style.borderRadius = '4px 0 0 4px'; // فقط سمت چپ گرد
    toggleBtn.style.border = '1px solid #ced4da';
    toggleBtn.style.borderLeft = 'none';
    toggleBtn.style.background = 'white';
    toggleBtn.style.boxShadow = 'none';
    toggleBtn.title = 'نمایش رمز عبور';

    // ✅ تنظیم پدینگ فیلد برای جلوگیری از همپوشانی
    passwordInput.style.paddingLeft = '48px'; // فضای کافی برای دکمه + متن
    passwordInput.style.borderRadius = '0 4px 4px 0'; // فقط سمت راست گرد
    passwordInput.style.borderLeft = 'none';

    // اضافه کردن دکمه به wrapper
    wrapper.appendChild(toggleBtn);

    // ✅ منطق تغییر وضعیت
    let isPasswordVisible = false;
    toggleBtn.addEventListener('click', function(e) {
        e.preventDefault();
        if (isPasswordVisible) {
            passwordInput.type = 'password';
            toggleBtn.innerHTML = '<i class="fas fa-eye"></i>';
            toggleBtn.title = 'نمایش رمز عبور';
        } else {
            passwordInput.type = 'text';
            toggleBtn.innerHTML = '<i class="fas fa-eye-slash"></i>';
            toggleBtn.title = 'پنهان کردن رمز عبور';
        }
        isPasswordVisible = !isPasswordVisible;
        passwordInput.focus();
    });
});
</script>

{% endblock %}

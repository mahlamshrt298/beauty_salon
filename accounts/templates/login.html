{% extends 'base.html' %}

{% block content %}
<!-- برای استتایل دهی اختصاصی(عکس پسزمینه داره)-->
<script>document.body.classList.add('login-page');</script>

<div class="container mt-5">

    <h2 class="mb-2 text-center fw-bold">ورود به حساب کاربری</h2>
    <p class="text-muted text-center mb-4">
        خوش آمدید 🌸 لطفاً وارد حساب خود شوید
    </p>

    <!-- کانتینر وسط‌چین برای نمایش درست در سایزهای مختلف صفحه -->
    <div class="row justify-content-center">
        <!-- تنظیم عرض فرم در دستگاه‌های مختلف (موبایل، تبلت، دسکتاپ) -->
        <div class="col-11 col-sm-8 col-md-5 col-lg-4">

            <!-- کارت -->
            <div class="card shadow p-4">

                <form method="POST" action="{% url 'accounts:login' %}" >
                    {% csrf_token %}

                    <!--  نام کاربری -->
                    <div class="mb-3">
                        <label class="form-label">نام کاربری</label>
                        <input type="text" name="username" class="form-control" required autofocus tabindex="1">
                    </div>

                    <!--  رمز عبور -->
                    <div class="mb-3">
                        <label class="form-label">رمز عبور</label>
                        <input type="password" id="id_password" name="password" class="form-control" required tabindex="2">
                    </div>

                    <!-- فیلد مخفی برای هدایت کاربر به صفحه قبلی (در صورت وجود پارامتر next در URL) -->
                    <input type="hidden" name="next" value="{{ next }}">

                    <button class="btn btn-primary w-100 mt-3" type="submit" tabindex="3">ورود</button>
                </form>
    
                <p class="text-center mt-3 mb-0">
                    حساب کاربری ندارید؟
                    <a href="{% url 'accounts:register' %}">ثبت‌نام کنید</a>
                </p>
                <p class="text-center mt-3">
                    <a href="{% url 'accounts:password_reset' %}">رمز عبور را فراموش کرده‌اید؟</a>
                </p>
            </div>
        </div>
    </div>
</div>

<!--  اسکریپت جابجایی بین فیلدها با کلید Enter -->    
<script>
document.addEventListener("keydown", function (e) {
    // اگر کلید فشرده شده Enter نبود، کاری انجام نده
    if (e.key !== "Enter") return;

    const target = e.target;

    // این قابلیت فقط برای فیلدهای input کار کند
    if (target.tagName !== "INPUT") return;

    const form = target.form;
    if (!form) return;

    // پیدا کردن تمام inputهای فرم که مخفی یا غیرفعال نیستند
    const inputs = Array.from(
        form.querySelectorAll("input:not([type=hidden]):not([disabled])")
    );

    const index = inputs.indexOf(target);

     // اگر فیلد فعلی، آخرین فیلد فرم نیست برو بعدی
    if (index > -1 && index < inputs.length - 1) {
        e.preventDefault(); // از ارسال فرم جلوگیری کن
        inputs[index + 1].focus(); // فوکوس را به فیلد بعدی منتقل کن
    }
    // اگر آخرین input بود (مثل دکمه submit یا آخرین فیلد متنی) فرم به صورت طبیعی ارسال می‌شود
});
</script>

<!--اسکریپت نمایش/پنهان کردن رمز عبور -    -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    // اجرای اسکریپت فقط در صورتی که آدرس صفحه شامل '/login' باشد
    if (!window.location.pathname.includes('/login')) return;

    // پیدا کردن فیلد رمز عبور
    const passwordInput = document.getElementById('id_password');
    if (!passwordInput) return;

    // کدهای SVG برای آیکون‌های چشم باز (نمایش) و چشم بسته (پنهان)
    const eyeIcon = `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
    const eyeSlashIcon = `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;

    const wrapper = document.createElement('div');
    wrapper.style.position = 'relative';
    wrapper.style.width = '100%';
    passwordInput.parentNode.insertBefore(wrapper, passwordInput);
    wrapper.appendChild(passwordInput);

    const toggleBtn = document.createElement('button');
    toggleBtn.type = 'button'; // برای جلوگیری از ارسال فرم هنگام کلیک
    toggleBtn.innerHTML = eyeIcon; 
    
    // استایل‌دهی دکمه و قرار دادن آن در سمت چپ فیلد (مناسب برای چینش راست‌چین یا RTL)
    toggleBtn.style.cssText = `
        position: absolute;
        left: 8px;
        top: 50%;
        transform: translateY(-50%);
        z-index: 10;
        padding: 3px 8px;
        border: 1px solid #ced4da;
        border-radius: 4px;
        background: white;
        cursor: pointer;
        line-height: 1;
    `;
    toggleBtn.title = 'نمایش رمز عبور';
    passwordInput.style.paddingLeft = '48px'; // ایجاد فاصله داخلی تا متن روی دکمه نیفتد
    wrapper.appendChild(toggleBtn);

    let isVisible = false;
    toggleBtn.addEventListener('click', function(e) {
        e.preventDefault();
        isVisible = !isVisible; // تغییر وضعیت
        passwordInput.type = isVisible ? 'text' : 'password';
        // تغییر آیکون و تولتیپ دکمه
        toggleBtn.innerHTML = isVisible ? eyeSlashIcon : eyeIcon;  //  SVG هر دو حالت
        toggleBtn.title = isVisible ? 'پنهان کردن رمز عبور' : 'نمایش رمز عبور';
        // برگرداندن فوکوس به فیلد پس از کلیک روی دکمه
        passwordInput.focus();
    });
});
</script>

{% endblock %}

{% extends "panel/base_panel.html" %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-3 category-mobile-header">
    <h4>دسته‌بندی مقالات</h4>

    <div>
        <a href="{% url 'panel:article_list' %}" class="btn btn-outline-secondary">
            📄 مشاهده مقالات
        </a>

        <a href="{% url 'panel:article_category_add' %}" class="btn btn-primary">
            ➕ افزودن دسته‌بندی
        </a>
    </div>
</div>

<div class="table-scroll">
    <table class="table">
        <tr>
            <th>نام دسته</th>
            <th>عملیات</th>
        </tr>

        {% for c in categories %}
        <tr>
            <td class="text-center">{{ c.name }}</td>
            
            <td class="text-center">
                <a href="{% url 'panel:article_category_edit' c.id %}">✏️</a>

                <form method="post"
                    action="{% url 'panel:article_category_delete' c.id %}"
                    style="display:inline;">
                    {% csrf_token %}
                    <button type="submit"
                            class="btn btn-link p-0 text-danger"
                            onclick="return confirm('حذف شود؟')">
                        🗑
                    </button>
                </form>

            </td>
        </tr>
        {% endfor %}
    </table>
</div>

{% endblock %}

{% extends "panel/base_panel.html" %}
{% block content %}
<div class="container mt-4">

    <h2>افزودن منشی جدید</h2>

    <form method="post" class="card p-4 shadow">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">نام کاربری</label>
            <input type="text" name="username" class="form-control"  placeholder="مثال: ali" required>
        </div>

        <div class="mb-3">
            <label class="form-label">نام</label>
            <input type="text" name="first_name" class="form-control"  placeholder="مثال: علی" required>
        </div>

        <div class="mb-3">
            <label class="form-label">نام خانوادگی</label>
            <input type="text" name="last_name" class="form-control"  placeholder="مثال: رشیدی" required>
        </div>

        <div class="mb-3">
            <label for="phone" class="form-label">شماره تماس</label>
            <input type="tel" name="phone" class="form-control" id="phone"  placeholder="مثال: 09121234567" maxlength="11" pattern="09\d{9}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">رمز عبور</label>
            <input type="password" name="password" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">تکرار رمز عبور</label>
            <input type="password" name="confirm_password" class="form-control" required>
        </div>

        <button class="btn btn-success w-100 w-md-auto">ثبت منشی</button>
    </form>

</div>
{% endblock %}

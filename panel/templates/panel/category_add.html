{% extends "panel/base_panel.html" %}
{% block content %}

<div class="container mt-4">
    <h5 class="mb-3">افزودن دسته جدید</h5>

    <form method="post" class="col-md-8 col-12">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">نام دسته</label>
            <input type="text" name="name" class="form-control" required>
        </div>

        <div class="row g-2">
            <div class="col-6 col-md-auto">
                <button class="btn btn-success w-100 px-2">ثبت</button>
            </div>

            <div class="col-6 col-md-auto">
                <a href="{% url 'panel:services_list' %}" class="btn btn-secondary w-100 px-2">بازگشت</a>
            </div>
        </div>



    </form>
</div>

{% endblock %}

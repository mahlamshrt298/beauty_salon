{% extends "panel/base_panel.html" %}
{% block content %}

<div class="container mt-4">
    <h5 class="mb-3">افزودن زیردسته جدید</h5>

    <form method="post">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">دسته اصلی</label>
            <select name="category" class="form-select" required>
                {% for cat in categories %}
                    <option value="{{ cat.id }}">{{ cat.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">نام زیردسته</label>
            <input type="text" name="name" class="form-control" required>
        </div>

        <div class="row g-2">
            <div class="col-6 col-md-auto">
                <button type="submit" class="btn btn-success w-100 px-2">ثبت</button>
            </div>
            <div class="col-6 col-md-auto">
                <a href="{% url 'panel:services_list' %}" class="btn btn-secondary w-100 px-2">بازگشت</a>
            </div>
        </div>



    </form>
</div>

{% endblock %}
